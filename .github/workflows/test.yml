name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ⚠️ 这里**故意不含 Node 20**，虽然插件自己声明的是 `>=20 <26`。
        #
        # 两个声称不是一回事，分开说：
        #   · **插件运行时**（`plugins/*/package.json` 的 engines）—— `>=20 <26`。
        #     代码只用到 `import.meta.dirname`（Node 20.11+），宿主给什么版本就能跑什么版本。
        #   · **本仓的工具链**（根 package.json 的 engines）—— `>=22 <26`。
        #     因为 pnpm 11 依赖 `node:sqlite`（Node 22.5+），**它在 Node 20 上根本起不来**。
        #
        # 所以这里只测工具链真能跑的版本。把 Node 20 放进矩阵会红，而且红的原因
        # 与插件无关 —— 那会让人以为是兼容性坏了，实际是包管理器起不来。
        # **只声称在 CI 里验过的版本**，别写一个永远不会被验证的数字。
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ⚠️ 若干用例在没有下游消费项目语料时会 skip —— 这是有意的设计，不是故障。
      # 它们会 skip-with-loud-message 并把试过的每条路径打出来。
      # **skip 不算通过**：本仓是什么、没有什么，见 TEST-SCOPE.md。
      # 想跑全量就设 CONSUMER_REPO_ROOT 指向你自己的项目。
      - run: npm test
